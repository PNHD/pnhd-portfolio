name: Temporary Browserslist Audit Fix

on:
  push:
    branches: [fix/browserslist-audit]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/browserslist-audit
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply audit fix
        run: npm audit fix
      - name: Verify audit
        run: npm audit --audit-level=high
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "fix: update vulnerable browserslist dependency"
          git push origin HEAD:fix/browserslist-audit
