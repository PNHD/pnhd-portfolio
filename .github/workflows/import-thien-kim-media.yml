name: Import Thiên Kim media

on:
  push:
    branches:
      - feature/thien-kim-media-20260807
    paths:
      - .github/workflows/import-thien-kim-media.yml

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thien-kim-media-20260807

      - name: Download verified project media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/projects/thien-kim
          get() { curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$1" -o "$2"; }

          get 'https://drive.usercontent.google.com/download?id=1ayj0R_NkqpvD0YcbFBkXPLr8FbsBhY9s' public/projects/thien-kim/look-floral.webp
          get 'https://drive.usercontent.google.com/download?id=11PHZFe0-FRdAVMsNewSz4-w9VWEmYg8x' public/projects/thien-kim/look-white-denim.webp
          get 'https://drive.usercontent.google.com/download?id=1u3329z6BU6jP_YmnVK9m1L4eH0bIP1EI' public/projects/thien-kim/look-casual-street.webp
          get 'https://drive.usercontent.google.com/download?id=1R0KlDUDras-64z-8PSuoMnu0Z4oyr3CO' public/projects/thien-kim/look-pink.webp
          get 'https://drive.usercontent.google.com/download?id=1lXeHIPsfrV382Vqwb8p8j7EF0xq-q84F' public/projects/thien-kim/look-strawberry.webp
          get 'https://drive.usercontent.google.com/download?id=1btczxvvj0mKAzKKrO4NeE9HNOlk9SHTg' public/projects/thien-kim/look-devil.webp
          get 'https://drive.usercontent.google.com/download?id=1xBiPH24nnV6b6gSiCJDx6v3LGekce9Fv' public/projects/thien-kim/look-blue-street.webp
          get 'https://drive.usercontent.google.com/download?id=18xoTPqqK7Xxb3I3hWTKKCwKNkrGorcpm' public/projects/thien-kim/look-blue-home.webp

          get 'https://drive.usercontent.google.com/download?id=1K_yV-k2-4EHNlzEEdAa59gUHBwjmusPp' public/projects/thien-kim/video-green-poster.webp
          get 'https://drive.usercontent.google.com/download?id=1o82AlMg23vINl4j39SpaYiy5vJRofMwf' public/projects/thien-kim/video-country-poster.webp
          get 'https://drive.usercontent.google.com/download?id=18ggG_D4YStPaFNcJuhLTrutRaOoPz48C' public/projects/thien-kim/video-tuscany-poster.webp
          get 'https://drive.usercontent.google.com/download?id=1SuIkFzxJWdczMMf-lSo4OXIR-fLCYlqX' public/projects/thien-kim/video-white-lace-poster.webp

          get 'https://drive.usercontent.google.com/download?id=1FSgo_YQCRYY907xrabYkrCMol6VxGWl3' public/projects/thien-kim/video-green.mp4
          get 'https://drive.usercontent.google.com/download?id=1GQRzMz1h5U-d93HiRvKizieAYtAfYCKl' public/projects/thien-kim/video-country.mp4
          get 'https://drive.usercontent.google.com/download?id=1XHyxvtPiEg5o3jkBjJBfEd-tPw_Muj8V' public/projects/thien-kim/video-tuscany.mp4
          get 'https://drive.usercontent.google.com/download?id=1VtbS3MqYhTvRA3yGVI7UOkD5C6sKIOoL' public/projects/thien-kim/video-white-lace.mp4

          test -s public/projects/thien-kim/video-green.mp4
          test -s public/projects/thien-kim/video-country.mp4
          test -s public/projects/thien-kim/video-tuscany.mp4
          test -s public/projects/thien-kim/video-white-lace.mp4

      - name: Commit local media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/projects/thien-kim
          if git diff --cached --quiet; then
            echo 'Media already present.'
            exit 0
          fi
          git commit -m 'Add local Thiên Kim image and video media [skip ci]'
          git push origin HEAD:feature/thien-kim-media-20260807
