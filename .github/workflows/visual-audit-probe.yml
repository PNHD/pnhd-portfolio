name: Visual Audit Probe

on:
  pull_request:
    branches: [main]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Start static export server
        shell: bash
        run: |
          python3 -m http.server 3000 --directory out > /tmp/portfolio-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1
      - name: Capture responsive screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not available on runner"
            exit 1
          fi
          echo "Using $CHROME"
          shot() {
            local size="$1"; local file="$2"; local url="$3"
            "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
              --virtual-time-budget=2500 --window-size="$size" \
              --screenshot="visual/$file" "$url"
          }
          shot 1440,1000 home-desktop.png http://127.0.0.1:3000/
          shot 1440,1000 work-desktop.png http://127.0.0.1:3000/#work
          shot 1440,1000 experience-desktop.png http://127.0.0.1:3000/#experience
          shot 1440,1000 projects-desktop.png http://127.0.0.1:3000/#projects
          shot 1440,1000 full-work-desktop.png http://127.0.0.1:3000/work
          shot 390,844 home-mobile.png http://127.0.0.1:3000/
          shot 390,844 work-mobile.png http://127.0.0.1:3000/#work
          shot 390,844 projects-mobile.png http://127.0.0.1:3000/#projects
          shot 390,844 full-work-mobile.png http://127.0.0.1:3000/work
      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-audit
          path: visual/
          retention-days: 1
