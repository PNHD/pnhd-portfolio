name: Project Thumbnail Visual Audit

on:
  push:
    branches: [feature/project-thumbnails-video-proof]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build static export
        run: |
          npm ci
          npm run build
      - name: Serve static export
        shell: bash
        run: |
          python3 -m http.server 3000 --directory out >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/http.log
          exit 1
      - name: Capture project sections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=3500 --window-size=1440,1250 --screenshot=visual/home-projects-desktop.png 'http://127.0.0.1:3000/#projects'
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=3500 --window-size=390,1750 --screenshot=visual/home-projects-mobile.png 'http://127.0.0.1:3000/#projects'
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=3500 --window-size=1440,1500 --screenshot=visual/work-desktop.png 'http://127.0.0.1:3000/work.html'
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=3500 --window-size=390,1900 --screenshot=visual/work-mobile.png 'http://127.0.0.1:3000/work.html'
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: project-thumbnail-visual-audit
          path: visual/
          retention-days: 1
