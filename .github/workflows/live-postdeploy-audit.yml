name: Live Post-Deploy Audit

on:
  push:
    branches: [feature/dribbble-legacy-archive]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch production snapshot
        shell: bash
        run: |
          set -euo pipefail
          base="https://dangpham.pages.dev"
          mkdir -p live
          home_code=$(curl -L -sS --max-time 30 -o live/home.html -w '%{http_code}' "$base/" || true)
          work_code=$(curl -L -sS --max-time 30 -o live/work.html -w '%{http_code}' "$base/work" || true)
          old_code=$(curl -L -sS --max-time 30 -o live/old-route.html -w '%{http_code}' "$base/work/nova-ui-kit" || true)
          printf 'home=%s\nwork=%s\nold_route=%s\n' "$home_code" "$work_code" "$old_code" | tee live/status.txt
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ('home', 'work'):
              p = Path(f'live/{name}.html')
              text = p.read_text(errors='ignore') if p.exists() else ''
              title = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
              links = set(re.findall(r'https://dribbble\.com/shots/[^"<>& ]+', text))
              print(name, 'bytes=', len(text), 'title=', title.group(1) if title else '<none>', 'unique_shot_links=', len(links))
              for needle in ('Visual systems, digital experiences', '89 of 89 public', 'UI kits on UI8', 'Nova —', 'View full Dribbble archive'):
                  print(' ', needle, '=>', needle in text)
          PY
      - name: Upload production snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-snapshot
          path: live/
          retention-days: 1
