name: Dependency Fix Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/dribbble-legacy-archive
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply safe transitive fixes
        run: npm audit fix --package-lock-only || true
      - name: Pin patched Next.js toolchain
        run: npm install --package-lock-only --save-exact next@16.3.0 eslint-config-next@16.3.0
      - name: Verify zero known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Commit audited dependency update
        shell: bash
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: patch audited portfolio dependencies"
          git push origin HEAD:feature/dribbble-legacy-archive
