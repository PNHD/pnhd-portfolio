name: Dependency Audit Probe

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture audit before fix
        run: npm audit --json > npm-audit-before.json || true
      - name: Apply safe transitive fixes
        run: npm audit fix --package-lock-only || true
      - name: Probe patched Next.js toolchain
        run: npm install --package-lock-only --save-exact next@16.3.0 eslint-config-next@16.3.0
      - name: Capture audit after fix
        shell: bash
        run: |
          npm audit --json > npm-audit-after.json || true
          node -e 'const a=require("./npm-audit-after.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))'
      - name: Capture dependency diff
        run: git diff -- package.json package-lock.json > dependency-fix.patch
      - name: Upload dependency fix evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-fix-evidence
          path: |
            npm-audit-before.json
            npm-audit-after.json
            dependency-fix.patch
            package.json
            package-lock.json
          retention-days: 1
