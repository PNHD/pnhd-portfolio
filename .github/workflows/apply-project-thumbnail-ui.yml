name: Apply Project Thumbnail UI

on:
  push:
    branches: [feature/project-thumbnails-video-proof]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/project-thumbnails-video-proof
          fetch-depth: 0
      - name: Patch project cards
        shell: python
        run: |
          from pathlib import Path

          needle = '<div className={`project-visual project-visual-${index + 1}`}>\n'
          replacement = '<div className={`project-visual project-visual-${index + 1} project-visual-thumb`}>\n                <img\n                  className="project-thumb-img"\n                  src={project.thumbnail}\n                  alt={project.thumbnailAlt}\n                  loading="lazy"\n                />\n'

          for rel in ['src/app/page.tsx', 'src/app/work/page.tsx']:
              p = Path(rel)
              s = p.read_text()
              if needle not in s:
                  raise SystemExit(f'marker missing in {rel}')
              p.write_text(s.replace(needle, replacement, 1))

          css = Path('src/app/portfolio-refresh.css')
          s = css.read_text()
          marker = '/* Real project thumbnails */'
          if marker not in s:
              s += '''\n\n/* Real project thumbnails */\n.project-visual-thumb {\n  min-height: 220px;\n  padding: 0;\n  background: var(--panel);\n}\n\n.project-thumb-img {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  display: block;\n  object-fit: cover;\n  object-position: center top;\n  transition: transform .45s cubic-bezier(.2,.8,.2,1), filter .3s ease;\n}\n\n.project-card:hover .project-thumb-img {\n  transform: scale(1.018);\n}\n\n.project-visual-thumb::after {\n  opacity: 1;\n  mask-image: none;\n  background: linear-gradient(180deg, rgba(0,0,0,.38), transparent 34%, transparent 72%, rgba(0,0,0,.16));\n}\n\n.project-visual-thumb .project-visual-top {\n  position: absolute;\n  z-index: 2;\n  inset: 14px 14px auto 14px;\n  color: #fff;\n  text-shadow: 0 1px 8px rgba(0,0,0,.55);\n}\n\n.project-visual-thumb .project-visual-center,\n.project-visual-thumb .project-visual-lines { display: none; }\n\n@media (max-width: 1080px) {\n  .project-card:last-child .project-visual-thumb { min-height: 220px; }\n}\n'''
              css.write_text(s)
      - name: Commit UI patch
        shell: bash
        run: |
          git add src/app/page.tsx src/app/work/page.tsx src/app/portfolio-refresh.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: show real thumbnails on independent project cards"
          git push origin HEAD:feature/project-thumbnails-video-proof
