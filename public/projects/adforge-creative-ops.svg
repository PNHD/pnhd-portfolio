<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AdForge Creative Ops interface preview</title><desc id="desc">Stylized AI creative workflow with brief form and three structured concept cards.</desc><rect width="1200" height="675" fill="#f3f1ec"/><rect width="220" height="675" fill="#171917"/><rect x="28" y="26" width="32" height="32" rx="7" fill="#f5c64d"/><text x="44" y="49" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#211f17">A</text><text x="72" y="48" font-family="Arial" font-weight="700" font-size="18" fill="#fff">AdForge</text><g font-family="Arial" font-size="13" fill="#92978f"><text x="34" y="112" fill="#fff">CREATIVE BRIEF</text><text x="34" y="154">CONCEPT REVIEW</text><text x="34" y="196">PRODUCTION QUEUE</text></g><text x="260" y="52" font-family="Arial" font-size="12" font-weight="700" letter-spacing="1.3" fill="#86877f">CREATIVE OPERATIONS · CONCEPT GENERATOR</text><text x="260" y="91" font-family="Arial" font-size="30" font-weight="700" fill="#1c1f25">Turn a product brief into ad directions.</text><text x="260" y="115" font-family="Arial" font-size="12" fill="#767872">Generate structured angles, compare them, then select one for production.</text><rect x="260" y="145" width="320" height="475" rx="10" fill="#fff" stroke="#dedbd3"/><text x="282" y="177" font-family="Arial" font-size="11" font-weight="700" fill="#77786f">01 · INPUT BRIEF</text><text x="282" y="207" font-family="Arial" font-size="18" font-weight="700">Campaign context</text><g font-family="Arial"><text x="282" y="244" font-size="10" font-weight="700" fill="#5c5e59">PRODUCT</text><rect x="282" y="253" width="276" height="43" rx="7" fill="#fbfaf7" stroke="#ddd9d0"/><text x="294" y="279" font-size="11" fill="#2f322e">Lightweight travel backpack</text><text x="282" y="328" font-size="10" font-weight="700" fill="#5c5e59">AUDIENCE</text><rect x="282" y="337" width="276" height="67" rx="7" fill="#fbfaf7" stroke="#ddd9d0"/><text x="294" y="363" font-size="11" fill="#2f322e">Urban professionals who</text><text x="294" y="380" font-size="11" fill="#2f322e">travel often</text><text x="282" y="436" font-size="10" font-weight="700" fill="#5c5e59">PRIMARY GOAL</text><rect x="282" y="445" width="276" height="67" rx="7" fill="#fbfaf7" stroke="#ddd9d0"/><text x="294" y="471" font-size="11" fill="#2f322e">Drive first-purchase</text><text x="294" y="488" font-size="11" fill="#2f322e">conversions</text><rect x="282" y="535" width="276" height="42" rx="7" fill="#242820"/><text x="420" y="561" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">✦ Generate 3 directions</text></g><rect x="594" y="145" width="552" height="475" rx="10" fill="#fff" stroke="#dedbd3"/><text x="616" y="177" font-family="Arial" font-size="11" font-weight="700" fill="#77786f">02 · REVIEW</text><text x="616" y="207" font-family="Arial" font-size="18" font-weight="700">Creative directions</text><g><rect x="616" y="230" width="162" height="310" rx="8" fill="#fcfbf8" stroke="#e0ddd5"/><rect x="789" y="230" width="162" height="310" rx="8" fill="#fcfbf8" stroke="#bda442" stroke-width="2"/><rect x="962" y="230" width="162" height="310" rx="8" fill="#fcfbf8" stroke="#e0ddd5"/></g><g font-family="Arial"><text x="630" y="253" font-size="9" font-weight="700" fill="#8e8f88">DIRECTION 01</text><text x="803" y="253" font-size="9" font-weight="700" fill="#8e8f88">DIRECTION 02</text><text x="976" y="253" font-size="9" font-weight="700" fill="#8e8f88">DIRECTION 03</text><text x="630" y="286" font-size="15" font-weight="700">Pack lighter,</text><text x="630" y="305" font-size="15" font-weight="700">move faster</text><text x="803" y="286" font-size="15" font-weight="700">One bag.</text><text x="803" y="305" font-size="15" font-weight="700">Three cities.</text><text x="976" y="286" font-size="15" font-weight="700">Designed for</text><text x="976" y="305" font-size="15" font-weight="700">the overhead bin</text></g><g stroke="#e9e6df"><line x1="630" y1="333" x2="764" y2="333"/><line x1="803" y1="333" x2="937" y2="333"/><line x1="976" y1="333" x2="1110" y2="333"/><line x1="630" y1="399" x2="764" y2="399"/><line x1="803" y1="399" x2="937" y2="399"/><line x1="976" y1="399" x2="1110" y2="399"/></g><g font-family="Arial" font-size="9" fill="#999991"><text x="630" y="353">HOOK</text><text x="803" y="353">HOOK</text><text x="976" y="353">HOOK</text><text x="630" y="419">VISUAL SYSTEM</text><text x="803" y="419">VISUAL SYSTEM</text><text x="976" y="419">VISUAL SYSTEM</text></g><rect x="616" y="555" width="508" height="45" rx="8" fill="#252820"/><text x="635" y="575" font-family="Arial" font-size="9" font-weight="700" fill="#f5c64d">03 · PRODUCTION HANDOFF</text><text x="635" y="591" font-family="Arial" font-size="11" fill="#fff">Selected concept ready for copy, storyboard and variants</text></svg>