interface:
  display_name: "Mermail Procurement Agent"
  short_description: "Build evidence-backed vendor renewal dossiers and safe negotiation drafts from Mermail."
  default_prompt: "Use $mermail-procurement-agent to audit vendor renewals in my Mermail inbox, build evidence-backed dossiers, flag risks, and prepare unsent next-step drafts."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
