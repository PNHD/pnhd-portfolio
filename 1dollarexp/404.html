<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>404 — Page not found | The $1 Internet Experiment</title>
  <meta name="description" content="This page does not exist. Return to The $1 Internet Experiment.">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found {
      min-height: calc(100svh - 78px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-top: 72px;
      padding-bottom: 96px;
    }
    .not-found__code {
      margin: 0 0 28px;
      color: var(--acid);
      font: 900 clamp(4rem, 12vw, 8rem)/.9 ui-monospace, monospace;
      letter-spacing: -.08em;
    }
    .not-found h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5.7rem);
      line-height: .98;
      letter-spacing: -.06em;
    }
    .not-found h1 em { color: var(--violet); font-style: normal; }
    .not-found__description {
      max-width: 560px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 1.15rem;
    }
    .not-found .button { margin-top: 32px; }
    @media (max-width: 620px) {
      .not-found { min-height: calc(100svh - 78px); padding-top: 54px; padding-bottom: 64px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="The $1 Internet Experiment — Home">
      <span class="coin">$1</span>
      <span>The $1 Internet Experiment</span>
    </a>
  </header>
  <main class="not-found" id="main">
    <p class="kicker">THE $1 INTERNET EXPERIMENT · PAGE NOT FOUND</p>
    <p class="not-found__code" aria-hidden="true">404</p>
    <h1>Nothing here.<br><em>Back to the experiment.</em></h1>
    <p class="not-found__description">The page you requested does not exist. The experiment is still one click away.</p>
    <a class="button primary" href="/">Return to the experiment</a>
  </main>
</body>
</html>
